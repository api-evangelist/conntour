aid: conntour
name: Conntour
description: >-
  Conntour is an Israeli AI video-intelligence company building a
  natural-language search engine for security camera systems. Its vision and
  language models let operators search any camera feed in plain language to find
  any object, person, or situation in real time, raise automatic alerts, and
  investigate recorded footage in seconds — turning passive surveillance into
  active intelligence. Unlike legacy analytics that depend on preset object or
  motion definitions, Conntour's models scale to thousands of concurrent feeds
  (up to roughly 50 feeds per consumer GPU such as an Nvidia RTX 4090) and deploy
  fully on-premises, in the cloud, or in a hybrid mix, either augmenting existing
  VMS/security systems or serving as a standalone surveillance platform. Founded
  in 2024 by Matan Goldner and Tomer Kola, the company serves intelligence
  agencies, homeland security, law enforcement, military and defense,
  transportation, and enterprise customers. It raised a $7M seed round in March
  2026 led by General Catalyst, with participation from Y Combinator, SV Angel,
  and Liquid 2 Ventures.
